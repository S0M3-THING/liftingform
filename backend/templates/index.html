<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Coach</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 30px;
            margin-top: 30px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #loading {
            display: none;
            margin-top: 20px;
        }

        #results {
            display: none;
            margin-top: 40px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
        }

        .section {
            margin-top: 25px;
        }

        .issue {
            padding: 10px;
            margin: 8px 0;
            border-left: 4px solid #cc6600;
            background: #f5f5f5;
        }

        .recommendation {
            padding: 10px;
            margin: 8px 0;
            background: #f5f5f5;
        }

        .metric {
            margin: 8px 0;
        }

        #error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Form Coach</h1>

    <p>
        Upload a squat video and we'll analyze your form.
    </p>

    <div class="upload-box">

        <form id="uploadForm">

            <label for ="video">
                <strong>Squat video:</strong>
            </label>

            <br><br>

            <input
                type="file"
                id="video"
                name="video"
                accept="video/*"
                required
            >

            <br>

            <button type="submit">
                Analyze Squat
            </button>

        </form>

    </div>

    <div id="loading">
        Analyzing your squat... This may take a little while.
    </div>

    <div id="error"></div>

    <div id="results">

        <h2>Results</h2>

        <div class="score">
            <span id="score"></span>/100
        </div>

        <div class="section">

            <h3>Metrics</h3>

            <div id="metrics"></div>

        </div>

        <div class="section">

            <h3>Problems Detected</h3>

            <div id="issues"></div>

        </div>

        <div class="section">

            <h3>Recommendations</h3>

            <div id="recommendations"></div>

        </div>

    </div>


    <script>

        const form = document.getElementById("uploadForm");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const videoInput = document.getElementById("video");
            const video = videoInput.files[0];

            if (!video) {
                return;
            }

            const formData = new FormData();

            formData.append("video", video);

            document.getElementById("loading").style.display = "block";
            document.getElementById("results").style.display = "none";
            document.getElementById("error").textContent = "";

            try {

                const response = await fetch(
                    "/analyze",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.detail || "Analysis failed."
                    );

                }

                displayResults(data.analysis);

            } catch (error) {

                document.getElementById("error").textContent =
                    error.message;

            } finally {

                document.getElementById("loading").style.display = "none";

            }

        });


        function displayResults(analysis) {

            document.getElementById("results").style.display = "block";

            document.getElementById("score").textContent =
                analysis.score;


            const metricsContainer =
                document.getElementById("metrics");

            metricsContainer.innerHTML = "";


            for (const [key, value] of Object.entries(analysis.metrics)) {

                const div = document.createElement("div");

                div.className = "metric";

                div.innerHTML =
                    `<strong>${formatKey(key)}:</strong> ${value}`;

                metricsContainer.appendChild(div);

            }


            const issuesContainer =
                document.getElementById("issues");

            issuesContainer.innerHTML = "";


            if (analysis.issues.length === 0) {

                issuesContainer.innerHTML =
                    "<p>No major issues detected.</p>";

            } else {

                for (const issue of analysis.issues) {

                    const div = document.createElement("div");

                    div.className = "issue";

                    div.innerHTML =
                        `<strong>${issue.severity}</strong>: ${issue.description}`;

                    issuesContainer.appendChild(div);

                }

            }


            const recommendationsContainer =
                document.getElementById("recommendations");

            recommendationsContainer.innerHTML = "";


            if (analysis.recommendations.length === 0) {

                recommendationsContainer.innerHTML =
                    "<p>No recommendations.</p>";

            } else {

                for (const recommendation of analysis.recommendations) {

                    const div = document.createElement("div");

                    div.className = "recommendation";

                    div.textContent =
                        "• " + recommendation;

                    recommendationsContainer.appendChild(div);

                }

            }

        }


        function formatKey(key) {

            return key
                .replaceAll("_", " ")
                .replace(
                    /\b\w/g,
                    character => character.toUpperCase()
                );

        }

    </script>

</body>
</html>
